name: Aramil notification center draft checks

on:
  pull_request:
    paths:
      - 'objects/05-26-aramil-jnsyo6/**'
      - '.github/workflows/aramil-notification-center-ci.yml'
  push:
    branches:
      - feat/issue371-customer-notification-center
    paths:
      - 'objects/05-26-aramil-jnsyo6/**'
      - '.github/workflows/aramil-notification-center-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aramil-notify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install docs dependencies
        run: pip install -r requirements.txt
      - name: Validate JS syntax (no live Sprut or WB access)
        run: node --check objects/05-26-aramil-jnsyo6/docs/assets/javascripts/notification-center.js
      - name: Validate WB email catalog and Sprut push separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path("objects/05-26-aramil-jnsyo6/docs")
          cat=json.loads((base/"assets/notification-catalog.json").read_text(encoding="utf-8"))
          ids=[r["event_id"] for r in cat["rules"]]
          assert len(ids)==37 and len(ids)==len(set(ids))
          assert not any(x.startswith("room.") for x in ids)
          assert cat["rooms_push"]["owner"]=="Sprut.hub"
          assert len(cat["rooms_push"]["thermostats"])==4
          assert cat["api_url"] is None
          print("37 WB email rules; 4 Sprut push rooms; API not deployed")
          PY
      - name: Strict MkDocs site preview build
        run: mkdocs build --strict -f objects/05-26-aramil-jnsyo6/mkdocs.yml -d "$RUNNER_TEMP/aramil-site"
