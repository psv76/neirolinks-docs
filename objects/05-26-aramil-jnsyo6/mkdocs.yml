site_name: "05 26 · Баня Арамиль"
site_description: "Исполнительная документация системы автоматизации"
site_url: "https://psv76.github.io/neirolinks-docs/o/05-26-aramil-jnsyo6/"
use_directory_urls: true

theme:
  name: material
  language: ru
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: blue

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Об объекте: index.md
  - Быстрый старт: quick-start.md
  - Системы: systems.md
  - Что произойдёт, если…: scenarios.md
  - Настройки: settings.md
  - Аварии и неисправности: alarms.md
  - Сценарии:
      - Реестр: scripts/index.md
      - "01 Управление уставкой газового котла": scripts/01.md
      - "02 Контроль котла": scripts/02.md
      - "03 Аварийное переключение на электрокотёл": scripts/03.md
      - "04 Радиаторы": scripts/04.md
      - "05 Тёплый пол": scripts/05.md
      - "06 Контроль CO2 в комнате": scripts/06.md
      - "07 Контроль влажности": scripts/07.md
      - "08 Контроль протечек воды": scripts/08.md
      - "09 Контроль электроснабжения": scripts/09.md
      - "10 ПИД регулятор ТП": scripts/10.md
      - "11 ПИД регулятор радиаторы": scripts/11.md
      - "12 Антилегионелла": scripts/12.md
  - Техническое приложение: technical.md
  - История версий: versions.md

extra:
  generator: false
  social: []

copyright: "© 2026 NEIROLINKS"
